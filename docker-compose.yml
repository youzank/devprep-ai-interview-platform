services:
  postgres:
    image: postgres:16
    container_name: devprep-postgres
    environment:
      POSTGRES_DB: devprepdb
      POSTGRES_USER: devprep
      POSTGRES_PASSWORD: devprep123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: