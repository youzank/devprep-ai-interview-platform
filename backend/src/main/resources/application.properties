spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devprepdb}
spring.datasource.username=${DB_USERNAME:devprep}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2}

ollama.connect-timeout=5000
ollama.read-timeout=120000

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

server.port=8080